[package]
name = "server"
version = "0.1.0"
edition = "2024"
autobins = false

[dependencies]
rmcp = { version = "0.7", features = ["server", "macros", "schemars"] }
bollard = "0.19.2"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi"] }
futures = "0.3"
tokio-util = "0.7"
once_cell = "1.19"
shell-escape = "0.1"

[[bin]]
name = "sunaba"
path = "src/main.rs"
